<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wrong Turn — Destiny O'Connor</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232a2320'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle'%3E%F0%9F%97%BA%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Patrick+Hand&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="error-page">
    <div class="error-card">
      <span class="tape" aria-hidden="true"></span>
      <svg class="error-card__icon" viewBox="0 0 24 24" fill="none" stroke="#2a2320" stroke-width="1.6" aria-hidden="true">
        <path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2V6z"/>
        <path d="M9 4v14M15 6v14"/>
        <path d="M6 10l3 3-3 3" stroke="#e0602f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>Wrong turn.</h1>
      <p id="error-tagline">Looks like this stop isn't on the map.</p>
      <a href="index.html" class="btn-notebook">Back to the road trip</a>
    </div>
  </div>

  <script>
    const taglines = [
      "Looks like this stop isn't on the map.",
      "Uh-oh — took a wrong exit somewhere back there.",
      "404: this page drove off the page.",
      "You've wandered off the route. Let's turn around.",
      "Even road trips get a flat tire sometimes.",
      "This page is playing hide and seek. It's winning.",
      "Recalculating... this route doesn't exist."
    ];
    const el = document.getElementById('error-tagline');
    if (el) {
      el.textContent = taglines[Math.floor(Math.random() * taglines.length)];
    }
  </script>
</body>
</html>
